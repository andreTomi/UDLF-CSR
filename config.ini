# ==========================================
# General Settings
# ==========================================
# Task to perform. Allowed values: UDL, FUSION
UDL_TASK = UDL

# Method to use for UDL. 
# Allowed values: NONE, CPRR, RLRECOM, RLSIM, CONTEXTRR, RECKNNGRAPH, RKGRAPH, CORGRAPH, LHRR, BFSTREE, RDPAC, RFE
# Note: For CPRR and LHRR, specific backends like _SPARSE, _EIGEN, _BLAS, _MKL are supported.
UDL_METHOD = CPRR_MKL

# Number of elements in the dataset
SIZE_DATASET = 72000

# ==========================================
# Input Settings
# ==========================================
# Input file format. Allowed values: AUTO, MATRIX, RK
INPUT_FILE_FORMAT = RK

# Matrix type if input is a matrix. Allowed values: DIST (Distance), SIM (Similarity)
INPUT_MATRIX_TYPE = DIST

# Format of ranked lists if input is RK. Allowed values: NUM (Numeric), STR (String)
INPUT_RK_FORMAT = NUM

# Sorting algorithm used to convert a matrix to ranked lists. Allowed values: HEAP, INSERTION
MATRIX_TO_RK_SORTING = HEAP

# Path to the input dataset file
INPUT_FILE = path/to/dataset/rkLists.txt

# Path to the list of input files (optional)
INPUT_FILE_LIST = path/to/dataset/lists.txt

# Path to the ground truth classes for the dataset
INPUT_FILE_CLASSES = path/to/dataset/classes.txt

# Path to the directory containing dataset images (used for HTML output)
INPUT_IMAGES_PATH = path/to/dataset/images/

# ==========================================
# Output Settings
# ==========================================
# Enable or disable outputting results to a file. Allowed values: TRUE, FALSE
OUTPUT_FILE = TRUE

# Output file format. Allowed values: RK, MATRIX
OUTPUT_FILE_FORMAT = MATRIX

# Output matrix type. Allowed values: DIST (Distance), SIM (Similarity)
OUTPUT_MATRIX_TYPE = DIST

# Output RK format. Allowed values: NUM, STR, HTML, ALL
OUTPUT_RK_FORMAT = ALL

# Path to save the output results
OUTPUT_FILE_PATH = output/results.txt

# Number of ranked lists to export per HTML file (if HTML output is selected)
OUTPUT_HTML_RK_PER_FILE = 1

# Size of the ranked lists in the HTML output
OUTPUT_HTML_RK_SIZE = 20

# Enable color highlighting in HTML output. Allowed values: TRUE, FALSE
OUTPUT_HTML_RK_COLORS = TRUE

# Show before/after comparison in HTML output. Allowed values: TRUE, FALSE
OUTPUT_HTML_RK_BEFORE_AFTER = TRUE

# Path to save the execution log
OUTPUT_LOG_FILE_PATH = output/log.txt

# ==========================================
# Evaluation Settings
# ==========================================
# Enable efficiency evaluation (time measurements). Allowed values: TRUE, FALSE
EFFICIENCY_EVAL = TRUE

# Enable effectiveness evaluation (accuracy metrics). Allowed values: TRUE, FALSE
EFFECTIVENESS_EVAL = TRUE

# Compute Precision scores. Allowed values: TRUE, FALSE
EFFECTIVENESS_COMPUTE_PRECISIONS = TRUE

# Compute Mean Average Precision (MAP). Allowed values: TRUE, FALSE
EFFECTIVENESS_COMPUTE_MAP = TRUE

# Compute Recall scores. Allowed values: TRUE, FALSE
EFFECTIVENESS_COMPUTE_RECALL = TRUE

# Comma-separated list of Recall depths to compute
EFFECTIVENESS_RECALLS_TO_COMPUTE = 4,5,10,20,40

# Comma-separated list of Precision depths to compute
EFFECTIVENESS_PRECISIONS_TO_COMPUTE = 4,5,10,15,20,30,50,100

# ==========================================
# Method-Specific Parameters
# ==========================================
# Below are specific parameters for different algorithmic implementations.
# - L: Neighborhood size or list length
# - K: Number of nearest neighbors to consider
# - T: Number of iterations

# CPRR_SPARSE #
# Cartesian Product Reciprocal Rank using Sparse Matrices
PARAM_CPRR_SPARSE_L = 1000
PARAM_CPRR_SPARSE_K = 20 
PARAM_CPRR_SPARSE_T = 5  

# LHRR_SPARSE #
# Local High-Order Reciprocal Rank using Sparse Matrices
PARAM_LHRR_SPARSE_L = 1000
PARAM_LHRR_SPARSE_K = 20
PARAM_LHRR_SPARSE_T = 5

# CPRR_EIGEN #
# Cartesian Product Reciprocal Rank using Eigen Library
PARAM_CPRR_EIGEN_L = 1000
PARAM_CPRR_EIGEN_K = 20 
PARAM_CPRR_EIGEN_T = 5  

# LHRR_EIGEN #
# Local High-Order Reciprocal Rank using Eigen Library
PARAM_LHRR_EIGEN_L = 1000
PARAM_LHRR_EIGEN_K = 20
PARAM_LHRR_EIGEN_T = 5

# CPRR_BLAS #
# Cartesian Product Reciprocal Rank using BLAS
PARAM_CPRR_BLAS_L = 1000
PARAM_CPRR_BLAS_K = 20 
PARAM_CPRR_BLAS_T = 5  

# LHRR_BLAS #
# Local High-Order Reciprocal Rank using BLAS
PARAM_LHRR_BLAS_L = 1000
PARAM_LHRR_BLAS_K = 20
PARAM_LHRR_BLAS_T = 5

# CPRR_MKL #
# Cartesian Product Reciprocal Rank using Intel MKL
PARAM_CPRR_MKL_L = 1000
PARAM_CPRR_MKL_K = 20 
PARAM_CPRR_MKL_T = 5  

# LHRR_MKL #
# Local High-Order Reciprocal Rank using Intel MKL
PARAM_LHRR_MKL_L = 1000
PARAM_LHRR_MKL_K = 20
PARAM_LHRR_MKL_T = 5
